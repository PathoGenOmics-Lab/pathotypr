[package]
name = "pathotypr-core"
version = "1.0.2"
authors = ["Paula Ruiz Rodriguez <paula.ruiz.rodriguez@csic.es>"]
edition = "2021"
description = "Core library for pathotypr - A high-performance tool for genome classification and variant genotyping."
license = "AGPL-3.0-only"
repository = "https://github.com/PathoGenOmics-Lab/pathotypr"

[lib]
name = "pathotypr_core"
path = "src/lib.rs"

[[bin]]
name = "pathotypr"
path = "src/main.rs"

[dependencies]
# Performance
mimalloc = { version = "0.1", default-features = false }

# CLI and UI
clap = { version = "4.5.28", features = ["derive"] }
indicatif = "0.18.6"
log = "0.4"
env_logger = "0.11.6"
chrono = "0.4.39"

# Core Logic & ML
rand = { version = "0.8.5", features = ["small_rng"] }
rayon = "1.10.0"

# Data Handling & Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
zstd = "0.13.1"

# Bioinformatics
needletail = "0.7.3"
rustc-hash = "2.0.0"
flate2 = { version = "1.1", features = ["zlib-ng"], default-features = false }

# Other utilities from the original project
anyhow = "1.0.98"
bio = "4.0.1"
csv = "1.3.1"
tempfile = "3.20.0"
rust-lapper = "1.1.0"
# bio-types removed — GFF parser no longer uses bio_types::strand
fxhash = "0.2.1"

# Excel export
rust_xlsxwriter = "0.98"

# Text processing
regex = "1.10"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false
