# Dependency updates.
#
# The shape here is chosen to keep the updates and drop the noise:
#
#   * monthly, not weekly
#   * grouped, so one pull request carries a whole ecosystem's routine bumps
#   * majors kept apart, in their own pull request, because those are the ones
#     that change APIs and want a person
#
# The minor and patch group is merged automatically once CI passes; see
# .github/workflows/dependabot-auto-merge.yml. The major group never is.
#
# `schedule` here is Dependabot's own timer, not a cron in GitHub Actions: no
# workflow in this repository runs on a schedule.
#
# Security updates are a separate mechanism, enabled in the repository settings,
# and are unaffected by any of this: a vulnerable dependency still gets its own
# pull request the day the advisory lands, major or not. That is what would have
# surfaced the eight rust-openssl advisories rather than an outside bot.

version: 2

updates:
  # The Rust workspace: pathotypr-core and the desktop crate under src-tauri,
  # which share one lockfile at the root.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "cargo"
    # Temporary, with a precise condition for removing it rather than a vague
    # one.
    #
    # bincode 3.0.0 is not a usable release. Its entire lib.rs is
    # `compile_error!("https://xkcd.com/2347/")`, so it refuses to build by
    # design. It is not yanked and it is the crate's max_stable_version, so
    # Dependabot picks it correctly and the resulting pull request cannot ever
    # pass CI. It took the other five majors in its group down with it.
    #
    # Remove this when crates.io shows a bincode major that compiles. At that
    # point the move is a deliberate migration rather than a routine bump: the
    # 2.x line replaced serde-based `serialize`/`deserialize` with its own
    # Encode/Decode traits, and whether a model written by 1.3.3 still loads
    # has to be checked against the published Zenodo bundle before anything
    # ships.
    ignore:
      - dependency-name: "bincode"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]

  # The actions used by the workflows. Left unpinned they rot quietly: a major
  # of actions/checkout or actions/github-script eventually stops working on the
  # runner image, and the first sign of it is a red check on an unrelated pull
  # request.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: ["dependencies", "area:ci"]
    commit-message:
      prefix: "actions"
    groups:
      actions-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
