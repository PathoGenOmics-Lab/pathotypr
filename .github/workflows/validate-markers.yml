name: Validate marker proposal

on:
  discussion:
    types: [created, edited]

# The category slug is the only trigger condition. Matching on the title, as this
# workflow used to, made the run depend on wording the form does not control.
jobs:
  validate:
    if: github.event.discussion.category.slug == 'marker-proposals'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      discussions: write
    steps:
      - uses: actions/checkout@v4

      # The validator is a plain module with its own tests. Running them here
      # means a broken rule can never comment on someone's proposal.
      - name: Test the validator
        run: node --test .github/scripts/

      - name: Validate the proposal and comment
        uses: actions/github-script@v7
        with:
          script: |
            const path = `${process.env.GITHUB_WORKSPACE}/.github/scripts/validate-marker-tsv.js`;
            const { validateMarkerTsv, renderComment, COMMENT_MARKER } = require(path);

            const discussion = context.payload.discussion;
            const body = discussion.body || '';

            const result = validateMarkerTsv(body);

            // Community proposals are MTBC-only for now. This is a note rather
            // than a rejection: the form already asks for an MTBC member, and a
            // keyword miss should not block a valid submission.
            const mtbc = ['tuberculosis', 'mtbc', 'bovis', 'caprae', 'africanum',
                          'microti', 'pinnipedii', 'orygis', 'dassie',
                          'chimpanzee', 'mungi'];
            const haystack = `${discussion.title} ${body}`.toLowerCase();
            const scopeNote = mtbc.some(t => haystack.includes(t))
              ? null
              : 'No MTBC member is named anywhere in this proposal. Community marker sets are currently accepted for the *Mycobacterium tuberculosis* complex only, so please say which member these markers target.';

            const comment = renderComment(result, scopeNote);

            // Find a previous run's comment so an edit updates it in place.
            const existing = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  discussion(number: $number) {
                    comments(first: 100) { nodes { id body } }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: discussion.number,
            });

            const prior = existing.repository.discussion.comments.nodes
              .find(c => c.body.includes(COMMENT_MARKER));

            if (prior) {
              await github.graphql(`
                mutation($id: ID!, $body: String!) {
                  updateDiscussionComment(input: {commentId: $id, body: $body}) {
                    comment { id }
                  }
                }
              `, { id: prior.id, body: comment });
              core.info('Updated the existing validation comment.');
            } else {
              await github.graphql(`
                mutation($id: ID!, $body: String!) {
                  addDiscussionComment(input: {discussionId: $id, body: $body}) {
                    comment { id }
                  }
                }
              `, { id: discussion.node_id, body: comment });
              core.info('Posted a validation comment.');
            }

            core.summary
              .addHeading(`Marker proposal #${discussion.number}`, 3)
              .addRaw(comment.replace(COMMENT_MARKER, ''))
              .write();

            if (result.errors.length > 0) {
              core.notice(`${result.errors.length} problem(s) reported to the author.`);
            }

      # The discussion form applies this label already. Doing it here as well
      # covers proposals moved into the category by hand.
      - name: Label the discussion
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'marker-proposal';
            const discussion = context.payload.discussion;

            const data = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!, $label: String!) {
                repository(owner: $owner, name: $repo) {
                  label(name: $label) { id }
                  discussion(number: $number) {
                    id
                    labels(first: 50) { nodes { name } }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: discussion.number,
              label: LABEL,
            });

            const label = data.repository.label;
            if (!label) {
              core.warning(`The "${LABEL}" label does not exist in this repository, so nothing was applied.`);
              return;
            }

            const already = data.repository.discussion.labels.nodes
              .some(l => l.name === LABEL);
            if (already) {
              core.info('Already labelled.');
              return;
            }

            await github.graphql(`
              mutation($labelable: ID!, $labels: [ID!]!) {
                addLabelsToLabelable(input: {labelableId: $labelable, labelIds: $labels}) {
                  clientMutationId
                }
              }
            `, { labelable: data.repository.discussion.id, labels: [label.id] });

            core.info(`Applied the "${LABEL}" label.`);
