[package]
name = "pathotypr-gui"
version = "1.0.2"
description = "Pathotypr GUI - A desktop application for genome classification and variant genotyping"
authors = ["Paula Ruiz Rodriguez <paula.ruiz.rodriguez@csic.es>"]
edition = "2021"
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# rustls instead of the default native-tls: on Linux native-tls binds the
# system OpenSSL, which put a whole C TLS stack in the graph just to fetch
# files over HTTPS. Roots come from the system store, so users behind an
# institutional proxy with a private CA keep working.
reqwest = { version = "0.12", default-features = false, features = [
    "stream",
    "rustls-tls-native-roots",
    "charset",
    "http2",
    "system-proxy",
] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"

# Local core library
pathotypr-core = { path = "../pathotypr-core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
